name: Publish

# Publica a npm los paquetes cuya versión cambió (ver scripts/release.mjs).
# Se dispara al mergear a main algo que toque packages/.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/release.mjs'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write # tags <paquete>@<version>
  id-token: write # OIDC trusted publishing en npm

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Mismo prefijo que el job de Node 24 de ci.yml: reutiliza la caché del último CI de main.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-node24-turbo-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-turbo-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'turbo.json') }}-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: el trusted publishing por OIDC necesita npm >= 11.5.
          node-version-file: .node-version
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Los mismos checks que ci.yml: un push directo a main no publica sin pasarlos.
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:exports
      - run: pnpm test
      # turbo no borra entradas viejas: se podan antes de que actions/cache guarde la nueva.
      - name: Podar caché de turbo
        if: always()
        run: find .turbo/cache -type f -mtime +14 -delete 2>/dev/null || true
      - name: Publicar lo que cambió de versión
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.mjs
