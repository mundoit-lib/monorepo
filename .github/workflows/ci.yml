name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Las libs se usan en apps con Node 22 y 24 (ver engines en package.json).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # Sin caché remota, actions/cache es lo único que deja a turbo reutilizar tareas entre corridas.
      # Node va en la key porque turbo no lo incluye en el hash de las tareas.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-node${{ matrix.node }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-node${{ matrix.node }}-turbo-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:exports
      - run: pnpm test
